name: "Setup Node.js Environment"
description: "Reusable composite action to set up Node.js 20 with npm and Next.js caching"

inputs:
  node-version:
    description: "Node.js version to set up"
    required: false
    default: "20"

runs:
  using: "composite"
  steps:
    # Set up Node.js with npm caching targeting package-lock.json / package.json
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package.json'

    # Cache Next.js build output to accelerate rebuilds across workflow runs
    - name: Cache Next.js build output
      uses: actions/cache@v4
      with:
        path: |
          frontend/.next/cache
        # Key cache by OS, node version, and hash of frontend files
        key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package.json', 'frontend/tsconfig.json') }}-${{ hashFiles('frontend/app/**', 'frontend/components/**') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package.json', 'frontend/tsconfig.json') }}-
