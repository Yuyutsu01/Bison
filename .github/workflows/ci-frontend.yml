name: CI Frontend

# Triggers for Frontend CI: push to main, pull requests targeting main, and nightly cron schedule
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
      - '.github/actions/setup-node/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
      - '.github/actions/setup-node/**'
  schedule:
    - cron: '0 0 * * *'

jobs:
  lint-and-test:
    name: Frontend Lint, Type Check, Dead Code & Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Step 1: Check out repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Use composite action for Node setup and npm caching
      - name: Set up Node.js environment
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'

      # Step 3: Install Node modules
      - name: Install dependencies
        run: npm ci || npm install

      # Step 4: Run ESLint (enforces unused-imports rule)
      - name: Lint with ESLint
        run: npm run lint

      # Step 5: Verify formatting with Prettier
      - name: Check code formatting with Prettier
        run: npx prettier --check .

      # Step 6: TypeScript strict type verification
      - name: Strict type check with TypeScript
        run: npx tsc --noEmit

      # Step 7: Detect dead code / unused exports with ts-prune
      - name: Detect dead code with ts-prune
        run: npx ts-prune -e

      # Step 8: Security vulnerability scan on dependencies
      - name: Audit dependencies with npm audit
        run: npm audit --audit-level=high

      # Step 9: Run Vitest unit & component test suite with 70% coverage threshold
      - name: Run Vitest unit tests with coverage
        run: npm run test:coverage

      # Step 10: Verify Next.js production build succeeds cleanly
      - name: Build Next.js web application
        run: npm run build

      # Step 11: Upload coverage artifact
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
