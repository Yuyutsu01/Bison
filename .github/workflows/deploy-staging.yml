name: Deploy to Staging

# Automatically deploy to staging environment on merge/push to main branch
on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Build Multi-Stage Docker Images & Deploy Staging
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out codebase
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for multi-stage building and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build Backend multi-stage Docker image
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            bison-backend:${{ github.sha }}
            bison-backend:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 4: Build Frontend multi-stage Docker image
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: |
            bison-frontend:${{ github.sha }}
            bison-frontend:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 5: Test stack spin-up via Docker Compose
      - name: Spin up staging environment with Docker Compose
        run: |
          docker compose up -d

      # Step 6: Execute health check smoke test on running backend container
      - name: Run container health check smoke test
        run: |
          echo "Waiting for services to initialize..."
          sleep 10
          curl -f http://localhost:8000/health || (echo "Backend health check failed!" && exit 1)

      # Step 7: Clean up containers after validation
      - name: Tear down staging test containers
        run: |
          docker compose down

      # Step 8: Send completion notification (Slack / Discord webhook placeholder)
      - name: Notify Staging Deployment Success
        if: success()
        run: |
          echo "Staging Deployment Succeeded for Commit SHA: ${{ github.sha }}"

      - name: Notify Staging Deployment Failure
        if: failure()
        run: |
          echo "Staging Deployment Failed for Commit SHA: ${{ github.sha }}"
          exit 1
