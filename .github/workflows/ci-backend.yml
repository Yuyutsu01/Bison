name: CI Backend

# Triggers for Backend CI: push to main, pull requests targeting main, and nightly cron schedule
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/actions/setup-python/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
      - '.github/actions/setup-python/**'
  schedule:
    # Run nightly at midnight UTC to verify dependencies and health
    - cron: '0 0 * * *'

jobs:
  lint-and-test:
    name: Backend Lint, Quality Gates & Unit Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      # Step 1: Check out codebase
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Use reusable composite action for Python setup and caching
      - name: Set up Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: '3.11'

      # Step 3: Install dependencies and CI/quality tooling
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      # Step 4: Run Ruff for ultra-fast linting (imports, code smells)
      - name: Lint with Ruff
        run: ruff check .

      # Step 5: Enforce Black formatting standards
      - name: Check code formatting with Black
        run: black --check .

      # Step 6: Static type validation with Mypy
      - name: Static type check with Mypy
        run: mypy app/

      # Step 7: Dead code detection with Vulture (fails if unused functions/classes found)
      - name: Detect dead code with Vulture
        run: vulture app/ --min-confidence 80

      # Step 8: Cyclomatic complexity check with Radon (fails if function complexity > 10)
      - name: Check Cyclomatic Complexity with Radon
        run: radon cc app/ -a -nb --max B

      # Step 9: Audit dependencies for known vulnerabilities
      - name: Run dependency security audit with pip-audit
        run: pip-audit

      # Step 10: Secret scanning to prevent hardcoded credentials
      - name: Scan repository for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 11: Execute Pytest test suite with strict coverage enforcement
      # Enforces 80% total coverage and 90% coverage for core engine modules
      - name: Run unit & integration tests with Pytest Coverage
        run: |
          pytest --cov=app \
                 --cov-report=term-missing \
                 --cov-report=xml:coverage.xml \
                 --cov-fail-under=80 \
                 -n auto

      # Step 12: Upload coverage artifact for inspection
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
